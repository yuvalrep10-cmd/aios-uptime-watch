name: uptime
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: check
        env:
          WATCH_URL: ${{ secrets.WATCH_URL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 check.py
      - name: save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "uptime-bot"
            git config user.email "uptime-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state"
            git push
          fi
